<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Modifier</title><link rel="stylesheet" href="matrix-modifier.css"></head>
<body>
<div class="page"><header><div><small>LEVEL ENGINEERING SUITE/Matrix Modifier</small><h1>Matrix Modifier</h1></div><a href="../index.html">Back</a></header>
<div class="layout">
<section class="panel controls">
<label>Choose an object:</label>

value="Bouncy_Plank_Small">Bouncy_Plank_Small</option><option value="Bouncy_Plank">Bouncy_Plank</option><option value="Bouncy_Angle_Small">Bouncy_Angle_Small</option><option value="Bouncy_Angle">Bouncy_Angle</option><option value="Bouncy_Circle_Small">Bouncy_Circle_Small</option><option value="Bouncy_Circle">Bouncy_Circle</option></optgroup><optgroup label="Deadly / Static"><option value="DT_Square_Small">DT_Square_Small</option><option value="DT_Square">DT_Square</option><option value="DT_Plank_Tiny">DT_Plank_Tiny</option><option value="DT_Plank_Small">DT_Plank_Small</option><option value="DT_Plank">DT_Plank</option><option value="DT_Angle_Small">DT_Angle_Small</option><option value="DT_Angle">DT_Angle</option><option value="DT_Circle_Small">DT_Circle_Small</option><option value="DT_Circle">DT_Circle</option></optgroup><optgroup label="Zones"><option value="NoDraw_Square_Tiny">NoDraw_Square_Tiny</option><option value="NoDraw_Square_Small">NoDraw_Square_Small</option><option value="NoDraw_Square">NoDraw_Square</option><option value="Water_Square_Tiny">Water_Square_Tiny</option><option value="Water_Square_Small">Water_Square_Small</option><option value="Water_Square">Water_Square</option></optgroup><optgroup label="Magnets"><option value="Magnet_Square">Magnet_Square</option><option value="MagnetN_Square">MagnetN_Square</option></optgroup><optgroup label="Balls"><option value="Ball_Orange_Small">Ball_Orange_Small</option><option value="Ball_Orange">Ball_Orange</option><option value="Ball_Orange_Large">Ball_Orange_Large</option><option value="Ball_Yellow_Small">Ball_Yellow_Small</option><option value="Ball_Yellow">Ball_Yellow</option><option value="Ball_Yellow_Large">Ball_Yellow_Large</option><option value="Ball_Moveable_Small">Ball_Moveable_Small</option><option value="Ball_Moveable">Ball_Moveable</option><option value="Ball_Moveable_Large">Ball_Moveable_Large</option><option value="Ball_Red_Small">Ball_Red_Small</option><option value="Ball_Red">Ball_Red</option><option value="Ball_Red_Large">Ball_Red_Large</option><option value="Ball_Bouncy_Small">Ball_Bouncy_Small</option><option value="Ball_Bouncy">Ball_Bouncy</option><option value="Ball_Bouncy_Large">Ball_Bouncy_Large</option><option value="Ball_Rough_Small">Ball_Rough_Small</option><option value="Ball_Rough">Ball_Rough</option><option value="Ball_Rough_Large">Ball_Rough_Large</option><option value="Ball_Ice_Small">Ball_Ice_Small</option><option value="Ball_Ice">Ball_Ice</option><option value="Ball_Ice_Large">Ball_Ice_Large</option><option value="Ball_DT_Small">Ball_DT_Small</option><option value="Ball_DT">Ball_DT</option><option value="Ball_DT_Large">Ball_DT_Large</option></optgroup><optgroup label="Movable"><option value="Moveable_Plank_10">Moveable_Plank_10</option><option value="Moveable_Plank_20">Moveable_Plank_20</option></optgroup><optgroup label="Gears"><option value="Gear_1">Gear_1</option><option value="Gear_2">Gear_2</option><option value="Gear_3">Gear_3</option><option value="Gear_4">Gear_4</option><option value="Gear_5">Gear_5</option><option value="Gear_6">Gear_6</option><option value="Gear_7">Gear_7</option><option value="Gear_8">Gear_8</option></optgroup></select>
<div id="after" class="hidden">
<label>Structural Operation</label>
<select id="modifier"><option value="">Select</option><option value="scale">Scale</option><option value="rotate">Rotate</option><option value="stretch">Stretch &amp; Scale (x,y factor)</option><option value="speed">Speed / Z-index</option></select>
</div>
<div id="factor" class="hidden"><label>Factor:</label>
<div id="num" class="hidden"><input id="number" type="text" inputmode="decimal" value="1"><span>0 → 1000</span></div>
<div id="rot" class="hidden"><input id="rotation" type="range" min="-360" max="360" value="0"><output id="rotv">0°</output></div>
<div id="xy" class="hidden"><div>X<input id="x" type="text" inputmode="decimal" value="1"></div><div>Y<input id="y" type="text" inputmode="decimal" value="1"></div></div>
</div>
<button id="transformCopy" class="transform-copy" type="button">Transform Selection &amp; Copy</button>
<div id="copyToast" class="copy-toast" role="status" aria-live="polite"></div>
<div class="summary"><b>Object</b><span id="so">—</span><b>Modifier</b><span id="sm">—</span><b>Factor</b><span id="sf">—</span></div>
</section>
<section class="panel preview"><h2>Visual Preview</h2>
<label>Base shape</label><select id="shape"><option value="square">Square</option><option value="circle">Circle</option><option value="triangle">Triangle</option></select>
<div class="preview-stage"><canvas id="canvas" width="400" height="400"></canvas></div>
<p>Base factor = 1. The object's point stays at the exact center. Cyan preview uses partial transparency.</p>
</section></div></div>
<script src="matrix-modifier.js"></script></body></html>
